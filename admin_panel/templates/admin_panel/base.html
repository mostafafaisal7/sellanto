<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %} | Sellanto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #e2e8f0; min-height: 100vh; }
        
        .sidebar { position: fixed; left: 0; top: 0; width: 240px; height: 100vh; background: rgba(15,23,42,0.95); border-right: 1px solid rgba(99,102,241,0.2); padding: 1.5rem 1rem; z-index: 100; }
        .sidebar-brand { font-size: 1.4rem; font-weight: 700; color: #818cf8; margin-bottom: 2rem; display: flex; align-items: center; gap: 0.5rem; }
        .sidebar-nav { list-style: none; }
        .sidebar-nav li { margin-bottom: 0.25rem; }
        .sidebar-nav a { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: #94a3b8; text-decoration: none; border-radius: 0.5rem; transition: all 0.2s; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background: rgba(99,102,241,0.2); color: #fff; }
        .sidebar-nav a i { width: 20px; }
        
        .main-content { margin-left: 240px; padding: 1.5rem 2rem; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .page-header h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        
        .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.85rem; font-weight: 500; text-decoration: none; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
        .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.75rem; }
        
        .card { background: rgba(30,41,59,0.8); border: 1px solid rgba(99,102,241,0.2); border-radius: 1rem; padding: 1.25rem; margin-bottom: 1rem; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .card-title { font-size: 1rem; color: #e2e8f0; display: flex; align-items: center; gap: 0.5rem; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: rgba(30,41,59,0.8); border: 1px solid rgba(99,102,241,0.2); border-radius: 1rem; padding: 1.25rem; display: flex; align-items: center; gap: 1rem; }
        .stat-card .icon { width: 48px; height: 48px; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
        .stat-card .icon.blue { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .stat-card .icon.green { background: rgba(16,185,129,0.2); color: #34d399; }
        .stat-card .icon.purple { background: rgba(139,92,246,0.2); color: #a78bfa; }
        .stat-card .icon.pink { background: rgba(236,72,153,0.2); color: #f472b6; }
        .stat-card .icon.yellow { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .stat-card .icon.cyan { background: rgba(6,182,212,0.2); color: #22d3ee; }
        .stat-card .icon.red { background: rgba(239,68,68,0.2); color: #f87171; }
        .stat-card .value { font-size: 1.5rem; font-weight: 700; color: #fff; }
        .stat-card .label { font-size: 0.75rem; color: #64748b; }
        
        .badge { display: inline-flex; align-items: center; padding: 0.25rem 0.6rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; }
        .badge-success { background: rgba(16,185,129,0.2); color: #34d399; }
        .badge-warning { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .badge-danger { background: rgba(239,68,68,0.2); color: #f87171; }
        .badge-primary { background: rgba(99,102,241,0.2); color: #818cf8; }
        .badge-purple { background: rgba(139,92,246,0.2); color: #a78bfa; }
        .badge-cyan { background: rgba(6,182,212,0.2); color: #22d3ee; }
        
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid rgba(99,102,241,0.1); }
        th { font-size: 0.7rem; text-transform: uppercase; color: #64748b; font-weight: 600; background: rgba(15,23,42,0.5); }
        tr:hover { background: rgba(99,102,241,0.05); }
        
        .form-control { width: 100%; padding: 0.6rem 0.9rem; background: rgba(15,23,42,0.8); border: 1px solid rgba(99,102,241,0.3); border-radius: 0.5rem; color: #e2e8f0; font-size: 0.85rem; }
        .form-control:focus { outline: none; border-color: #6366f1; }
        .form-label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.35rem; }
        
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .tab { padding: 0.6rem 1.2rem; background: rgba(30,41,59,0.5); border: 1px solid rgba(99,102,241,0.2); border-radius: 0.5rem; color: #94a3b8; text-decoration: none; font-size: 0.85rem; transition: all 0.2s; }
        .tab:hover, .tab.active { background: rgba(99,102,241,0.2); color: #fff; border-color: rgba(99,102,241,0.5); }
        
        .row { display: flex; gap: 1rem; flex-wrap: wrap; }
        .col-4 { flex: 0 0 calc(33.333% - 0.67rem); }
        .col-6 { flex: 0 0 calc(50% - 0.5rem); }
        .col-8 { flex: 0 0 calc(66.666% - 0.33rem); }
        @media (max-width: 1024px) { .col-4, .col-6, .col-8 { flex: 0 0 100%; } }
        
        .token-badge { background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(234,179,8,0.1)); color: #fbbf24; padding: 0.2rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600; }
        .cost-badge { background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(5,150,105,0.1)); color: #34d399; padding: 0.2rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600; }
        
        .loading { display: flex; align-items: center; justify-content: center; padding: 2rem; color: #64748b; }
        .empty-state { text-align: center; padding: 2rem; color: #64748b; }
        .empty-state i { font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.5; }
        
        .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; background: rgba(16,185,129,0.9); color: #fff; border-radius: 0.5rem; z-index: 9999; animation: slideIn 0.3s ease; }
        .toast.error { background: rgba(239,68,68,0.9); }
        @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .messages-panel { max-height: 500px; overflow-y: auto; padding: 0.5rem; }
        .message-item { padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 0.75rem; max-width: 85%; }
        .message-item.user { background: rgba(59,130,246,0.15); margin-right: auto; border-bottom-left-radius: 0.25rem; }
        .message-item.bot { background: rgba(99,102,241,0.15); margin-left: auto; border-bottom-right-radius: 0.25rem; }
        .message-meta { font-size: 0.65rem; color: #64748b; margin-top: 0.25rem; }
        
        .conv-item { padding: 0.75rem; margin-bottom: 0.5rem; background: rgba(255,255,255,0.05); border-radius: 0.5rem; cursor: pointer; transition: all 0.2s; border-left: 3px solid transparent; }
        .conv-item:hover { background: rgba(99,102,241,0.2); }
        .conv-item.active { background: rgba(99,102,241,0.2); border-left-color: #6366f1; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand"><i class="fas fa-bolt"></i> Sellanto Admin</div>
        <ul class="sidebar-nav">
            <li><a href="{% url 'admin_panel:dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="{% url 'admin_panel:user_list' %}" class="{% if 'user' in request.resolver_match.url_name %}active{% endif %}"><i class="fas fa-users"></i> Users</a></li>
            <li><a href="{% url 'admin_panel:analytics' %}" class="{% if request.resolver_match.url_name == 'analytics' %}active{% endif %}"><i class="fas fa-chart-bar"></i> Analytics</a></li>
            <li><a href="/admin/" target="_blank"><i class="fas fa-cog"></i> Django Admin</a></li>
        </ul>
    </aside>
    
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <div id="toast" class="toast" style="display:none;"></div>
    
    <script>
        function getCsrfToken() {
            return document.cookie.split(';').find(c => c.trim().startsWith('csrftoken='))?.split('=')[1] || '';
        }
        
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }
        
        function truncate(str, len) {
            if (!str) return '-';
            return str.length > len ? str.substring(0, len) + '...' : str;
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
